<meta charset="UTF-8">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12141C">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#12141C; --surface:#1B1F2A; --surface-alt:#232838; --line:#2E3444;
    --text:#EDEFF4; --text-2:#9AA1B4;
    --amber:#E8A33D; --amber-soft:#3A3121;
    --sage:#6FA88A; --sage-soft:#1E2B26;
    --blue:#7C9CDE; --blue-soft:#1E2536;
    --red:#E8756B;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.serif{font-family:Georgia,'Iowan Old Style',serif;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
  .screen{flex:1;overflow-y:auto;padding:16px;padding-bottom:100px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;}
  .card-alt{background:var(--surface-alt);border:1px solid var(--line);border-radius:12px;}
  .row{display:flex;align-items:center;gap:10px;}
  .between{display:flex;align-items:center;justify-content:space-between;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .muted{color:var(--text-2);font-size:13px;}
  .label-sm{color:var(--text-2);font-size:12px;}
  .title-lg{font-size:20px;font-weight:600;margin:2px 0 0;}
  .pill{display:inline-flex;align-items:center;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface-alt);color:var(--text-2);white-space:nowrap;cursor:pointer;}
  .pill.active{background:var(--amber);color:#1B140A;border-color:var(--amber);}
  .pillbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-ms-overflow-style:none;scrollbar-width:none;}
  .pillbar::-webkit-scrollbar{display:none;}
  .btn{width:100%;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-amber{background:var(--amber);color:#1B140A;}
  .btn-ghost{background:var(--surface-alt);color:var(--text);border:1px solid var(--line);}
  .exrow{display:flex;align-items:center;gap:12px;padding:12px;cursor:pointer;}
  .exicon{width:56px;height:56px;border-radius:12px;background:var(--amber-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .exname{font-size:14px;font-weight:500;}
  .excue{padding:0 12px 12px;font-size:13px;color:var(--text-2);}
  .chip{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--amber-soft);color:var(--amber);}
  .chip.sage{background:var(--sage-soft);color:var(--sage);}
  input[type=text],input[type=number]{background:var(--surface-alt);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;}
  .tabbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);}
  .tabbtn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 8px;cursor:pointer;font-family:inherit;}
  .tabbtn span{font-size:10.5px;color:var(--text-2);}
  .tabbtn.active span{color:var(--amber);}
  ul.plain{margin:0;padding-left:18px;}
  ul.plain li{margin-bottom:4px;font-size:13px;color:var(--text-2);}
  .heart{cursor:pointer;background:none;border:none;padding:4px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0;}
  .installbtn{font-size:12px;background:var(--sage);color:#0E1A15;border:none;border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer;}
  .checkitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .checkitem.done{color:var(--text-2);text-decoration:line-through;}
  .timerbox{margin-top:8px;display:flex;align-items:center;gap:10px;}
  .timernum{font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;}
</style>
</head>

  heartFilled:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.5-9.5-9C.5 8 2 4 6 4c2.2 0 3.6 1.2 4.5 2.4C11.4 5.2 12.8 4 15 4c4 0 5.5 4 3.5 8-2.5 4.5-9.5 9-9.5 9Z"/></svg>',
  heart:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9C.5 8 2 4 6 4c2.2 0 3.6 1.2 4.5 2.4C11.4 5.2 12.8 4 15 4c4 0 5.5 4 3.5 8-2.5 4.5-9.5 9-9.5 9Z"/></svg>',
  chevDown:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
  chevRight:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};

/* ================= PROGRAM LOGIC ================= */
function getWeekInfo(today){
  var diffDays=Math.floor((today-START_DATE)/86400000);
  if(diffDays<0) return {phase:"pre",week:0};
  var week=Math.floor(diffDays/7)+1;
  if(week<=4) return {phase:"intensive",week:week};
  if(week<=15) return {phase:"steady",week:week};
  return {phase:"done",week:week};
}
function getStepTarget(week,phase){
  if(phase==="pre"||week<=2) return "7.000";
  if(week<=4) return "8.000";
  return "8.000–10.000";
}
function getCircuitParams(phase){
  return phase==="steady" ? {giri:3,tempo:"40”/20”",duration:"~28 min"} : {giri:4,tempo:"40”/20”",duration:"~35 min"};
}
function dateKey(d){ return d.toISOString().slice(0,10); }

/* ================= APP STATE ================= */
var state={
  tab:"oggi",
  today: new Date(),
  workoutMode: null,
  ricetteFilter:"tutte",
  openRecipe:null,
  openExercise:null,
  timerRecipeId:null,
  timerSeconds:0,
  timerRunning:false
};
state.workoutMode = getLS("mode-"+dateKey(state.today), DEFAULT_SUGGESTION[state.today.getDay()]);

var favorites = getLS("favorite-recipes",[]);
var weightLog = getLS("weight-log",[]);
var shoppingChecked = getLS("shopping-checked",{});

var deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){ e.preventDefault(); deferredInstallPrompt=e; render(); });

/* ================= RENDER HELPERS ================= */
function h(strings){ // not used, placeholder
}

function renderTopbar(){
  var installBtn = deferredInstallPrompt ? '<button class="installbtn" onclick="installApp()">Installa app</button>' : '';
  return '<div class="topbar"><div class="label-sm">Piano Andrea</div>'+installBtn+'</div>';
}

function installApp(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(function(){ deferredInstallPrompt=null; render(); });
}

function renderExerciseRow(id, showCue){
  var ex=EXERCISES[id];
  if(!ex) return "";
  var open = state.openExercise===id;
  var cueHtml = (showCue!==false && open) ? '<div class="excue">'+ex.cue+'</div>' : '';
  return '<div class="card-alt" style="margin-bottom:8px;">'+
    '<div class="exrow" onclick="toggleExercise(\''+id+'\')">'+
      '<div class="exicon">'+exerciseSVG(ex.pose,"#E8A33D",40)+'</div>'+
      '<div style="flex:1;">'+
        '<div class="exname">'+ex.name+'</div>'+
        (showCue!==false ? '<div class="label-sm">'+(open?'':'Tocca per la spiegazione')+'</div>' : '')+
      '</div>'+
      '<div style="color:var(--text-2)">'+(open?ICONS.chevDown:ICONS.chevRight)+'</div>'+
    '</div>'+cueHtml+
  '</div>';
}
function toggleExercise(id){ state.openExercise = state.openExercise===id?null:id; render(); }

/* ---- OGGI ---- */
function renderOggi(){
  var today=state.today, dow=today.getDay();
  var wi=getWeekInfo(today);
  var stepTarget=getStepTarget(wi.week,wi.phase);
  var isMonday = dow===1;
  var mode = WORKOUT_MODES.find(function(m){return m.id===state.workoutMode;}) || WORKOUT_MODES[0];
  var wantIntenso = mode.id==="forza"||mode.id==="intenso";

  var seed = today.getDate();
  var mealsHtml = MEAL_ORDER.map(function(meal,i){
    var opts=RECIPES.filter(function(r){return r.meal===meal;});
    var preferred = wantIntenso ? opts.filter(function(r){return r.intenso;}) : opts.filter(function(r){return !r.intenso;});
    var pool = preferred.length? preferred : opts;
    var r = pool[(seed+i)%pool.length];
    return '<div class="between card-alt" style="padding:10px 12px;margin-bottom:8px;">'+
      '<div><div class="label-sm">'+MEAL_LABELS[meal]+'</div><div style="font-size:14px;">'+r.name+'</div></div>'+
      '<div style="color:var(--sage);cursor:pointer" onclick="goRicette(\''+meal+'\')">'+ICONS.chevRight+'</div>'+
    '</div>';
  }).join("");

  var phaseLabel = wi.phase==="pre" ? "Il programma inizia lunedì 14/09"
    : wi.phase==="intensive" ? "Settimana "+wi.week+" di 15 — fase incisiva"
    : wi.phase==="steady" ? "Settimana "+wi.week+" di 15 — fase costante"
    : "Programma concluso — tempo di bilanci";

  return renderTopbar()+'<div class="screen">'+
    '<div class="card">'+
      '<div class="label-sm">'+DAY_NAMES[dow]+' · '+today.toLocaleDateString("it-IT",{day:"numeric",month:"long"})+'</div>'+
      '<div class="title-lg serif">'+phaseLabel+'</div>'+
    '</div>'+
    '<div class="grid2">'+
      '<div class="card" style="background:var(--blue-soft);">'+ICONS.foot+'<div class="label-sm" style="margin-top:8px;">Passi oggi</div><div style="font-size:17px;font-weight:600;">'+stepTarget+'</div></div>'+
      '<div class="card" style="background:var(--amber-soft);">'+ICONS.flame+'<div class="label-sm" style="margin-top:8px;">Allenamento</div><div style="font-size:14px;font-weight:600;">'+mode.full+'</div></div>'+
    '</div>'+
    (isMonday ? '<div class="card row" style="background:var(--sage-soft);">'+ICONS.down+'<div style="font-size:14px;">Oggi è lunedì: pesati a digiuno e registra il dato in Progressi.</div></div>' : '')+
    '<button class="btn btn-amber" onclick="goTab(\'allenamento\')" style="margin-bottom:16px;">Vai all\'allenamento</button>'+
    '<div class="label-sm" style="margin-bottom:8px;">Idee pasto per oggi</div>'+
    mealsHtml+
  '</div>'+renderTabbar();
}
function goRicette(meal){ state.tab="ricette"; state.ricetteFilter=meal; render(); }
function goTab(t){ state.tab=t; render(); window.scrollTo(0,0); }

/* ---- ALLENAMENTO ---- */
function renderAllenamento(){
  var wi=getWeekInfo(state.today);
  var circuit=getCircuitParams(wi.phase==="pre"?"intensive":wi.phase);
  var mode = WORKOUT_MODES.find(function(m){return m.id===state.workoutMode;}) || WORKOUT_MODES[0];

  var pills = WORKOUT_MODES.map(function(m){
    return '<div class="pill '+(m.id===mode.id?'active':'')+'" onclick="setMode(\''+m.id+'\')">'+m.label+'</div>';
  }).join("");

  var meta = mode.id==="forza" ? (circuit.giri+' giri · '+circuit.tempo+' · '+circuit.duration)
    : mode.id==="zona2" ? "25-30 min, alternando ogni 2 minuti"
    : mode.id==="intenso" ? "3 giri · 40”/20” · 20-22 min"
    : mode.id==="lungo" ? "40-50 min, anche spezzata in 2 sessioni"
    : "10 min di recupero attivo";

  var exList = mode.exIds.map(function(id){return renderExerciseRow(id,true);}).join("");
  var minimalList = MINIMAL_ROUTINE.map(function(id){return renderExerciseRow(id,false);}).join("");

  return renderTopbar()+'<div class="screen">'+
    '<div class="pillbar">'+pills+'</div>'+
    '<div class="card">'+
      '<div class="title-lg serif" style="font-size:18px;">'+mode.full+'</div>'+
      '<div class="muted" style="margin-top:4px;">'+meta+'</div>'+
    '</div>'+
    exList+
    '<button class="btn btn-ghost" style="margin-top:8px;" onclick="toggleMinimal()">'+(state.showMinimal?'Nascondi':'Mattina storta? Routine minima 12 min')+'</button>'+
    (state.showMinimal ? '<div class="card" style="background:var(--sage-soft);margin-top:10px;"><div style="font-size:14px;margin-bottom:8px;">EMOM 12\': un esercizio al minuto, ripeti 4 volte.</div>'+minimalList+'</div>' : '')+
  '</div>'+renderTabbar();
}
function setMode(id){ state.workoutMode=id; setLS("mode-"+dateKey(state.today), id); render(); }
function toggleMinimal(){ state.showMinimal=!state.showMinimal; render(); }

/* ---- RICETTE ---- */
function startTimer(recipeId, minutes){
  if(state.timerInterval) clearInterval(state.timerInterval);
  state.timerRecipeId=recipeId;
  state.timerSeconds=Math.max(1,minutes)*60;
  state.timerRunning=true;
  state.timerInterval=setInterval(function(){
    state.timerSeconds--;
    if(state.timerSeconds<=0){ clearInterval(state.timerInterval); state.timerRunning=false; }
    render();
  },1000);
  render();
}
function stopTimer(){
  if(state.timerInterval) clearInterval(state.timerInterval);
  state.timerRunning=false; state.timerRecipeId=null; render();
}
function fmtTimer(s){
  var m=Math.floor(s/60), sec=s%60;
  return (m<10?"0":"")+m+":"+(sec<10?"0":"")+sec;
}

function toggleFavorite(id,ev){
  if(ev) ev.stopPropagation();
  var i=favorites.indexOf(id);
  if(i>=0) favorites.splice(i,1); else favorites.push(id);
  setLS("favorite-recipes",favorites);
  render();
}
function toggleRecipe(id){ state.openRecipe = state.openRecipe===id?null:id; render(); }
function setFilter(f){ state.ricetteFilter=f; render(); }

function renderRicette(){
  var filters=[["tutte","Tutte"]].concat(MEAL_ORDER.map(function(m){return [m,MEAL_LABELS[m]];})).concat([["preferiti","Preferiti"]]);
  var pills = filters.map(function(f){
    return '<div class="pill '+(state.ricetteFilter===f[0]?'active':'')+'" onclick="setFilter(\''+f[0]+'\')">'+f[1]+'</div>';
  }).join("");

  var list = state.ricetteFilter==="tutte" ? RECIPES
    : state.ricetteFilter==="preferiti" ? RECIPES.filter(function(r){return favorites.indexOf(r.id)>=0;})
    : RECIPES.filter(function(r){return r.meal===state.ricetteFilter;});

  var cards = list.map(function(r){
    var open = state.openRecipe===r.id;
    var fav = favorites.indexOf(r.id)>=0;
    var mins = parseInt(r.time) || 10;
    var timerActive = state.timerRecipeId===r.id;
    var body = "";
    if(open){
      body = '<div class="excue">'+
        '<div style="margin-bottom:8px;"><span class="chip sage">'+r.tag+'</span></div>'+
        '<div style="font-weight:600;color:var(--text);margin-bottom:4px;">Ingredienti</div>'+
        '<ul class="plain">'+r.ing.map(function(i){return '<li>'+i+'</li>';}).join("")+'</ul>'+
        '<div style="font-weight:600;color:var(--text);margin:8px 0 4px;">Preparazione</div>'+
        '<ol class="plain">'+r.steps.map(function(st){return '<li>'+st+'</li>';}).join("")+'</ol>'+
        '<div class="timerbox">'+
          (timerActive
            ? '<span class="timernum">'+fmtTimer(state.timerSeconds)+'</span><button class="pill" onclick="stopTimer()">Ferma</button>'
            : '<button class="pill" onclick="startTimer(\''+r.id+'\','+mins+')">Avvia timer '+mins+'\'</button>')+
        '</div>'+
      '</div>';
    }
    return '<div class="card-alt" style="margin-bottom:8px;">'+
      '<div class="exrow" onclick="toggleRecipe(\''+r.id+'\')">'+
        '<div style="flex:1;">'+
          '<div class="row" style="gap:8px;"><span class="chip">'+MEAL_LABELS[r.meal]+'</span><span class="label-sm">'+r.time+'</span></div>'+
          '<div class="exname" style="margin-top:5px;">'+r.name+'</div>'+
        '</div>'+
        '<button class="heart" onclick="toggleFavorite(\''+r.id+'\',event)" style="color:'+(fav?'var(--amber)':'var(--text-2)')+'">'+(fav?ICONS.heartFilled:ICONS.heart)+'</button>'+
        '<div style="color:var(--text-2)">'+(open?ICONS.chevDown:ICONS.chevRight)+'</div>'+
      '</div>'+body+
    '</div>';
  }).join("") || '<div class="muted" style="text-align:center;padding:24px 0;">Nessuna ricetta qui — prova un altro filtro.</div>';

  var eatingOut = EATING_OUT.map(function(o){
    return '<div class="card-alt" style="padding:12px;margin-bottom:8px;"><div style="font-weight:600;font-size:14px;margin-bottom:4px;">'+o.title+'</div><div class="muted">'+o.tip+'</div></div>';
  }).join("");

  return renderTopbar()+'<div class="screen">'+
    '<div class="pillbar">'+pills+'</div>'+
    '<div class="card" style="background:var(--sage-soft);font-size:12px;">Tutte le ricette sono senza glutine e senza lattosio. Ristorante consigliato 1 volta/settimana, salse sempre a parte.</div>'+
    cards+
    '<div class="label-sm" style="margin:16px 0 8px;">Fuori casa</div>'+
    eatingOut+
  '</div>'+renderTabbar();
}

/* ---- SPESA ---- */
function toggleShopping(item){
  shoppingChecked[item] = !shoppingChecked[item];
  setLS("shopping-checked",shoppingChecked);
  render();
}
function resetShopping(){
  shoppingChecked={};
  setLS("shopping-checked",shoppingChecked);
  render();
}
function renderSpesa(){
  var cats = SHOPPING_CATEGORIES.map(function(c){
    var items = c.items.map(function(it){
      var done = !!shoppingChecked[it];
      return '<div class="checkitem '+(done?'done':'')+'" onclick="toggleShopping(\''+it.replace(/'/g,"\\'")+'\')" style="cursor:pointer;">'+
        '<span style="width:16px;height:16px;border-radius:5px;border:1px solid var(--line);background:'+(done?'var(--amber)':'transparent')+';flex-shrink:0;"></span>'+it+
      '</div>';
    }).join("");
    return '<div class="card"><div style="font-weight:600;margin-bottom:6px;">'+c.cat+'</div>'+items+'</div>';
  }).join("");
  return renderTopbar()+'<div class="screen">'+
    '<div class="label-sm" style="margin-bottom:10px;">Lista della spesa base — spunta man mano che acquisti.</div>'+
    cats+
    '<button class="btn btn-ghost" onclick="resetShopping()">Azzera lista</button>'+
  '</div>'+renderTabbar();
}

/* ---- PROGRESSI ---- */
function saveWeight(){
  var input = document.getElementById("weightInput");
  var w = parseFloat(input.value.replace(",","."));
  var errBox = document.getElementById("weightErr");
  if(!w || w<40 || w>250){ errBox.textContent="Inserisci un peso valido (es. 108.5)"; return; }
  errBox.textContent="";
  var entry={date:dateKey(state.today), weight:w};
  weightLog = weightLog.filter(function(l){return l.date!==entry.date;});
  weightLog.push(entry);
  weightLog.sort(function(a,b){return a.date<b.date?-1:1;});
  setLS("weight-log",weightLog);
  input.value="";
  render();
}
function resetWeightLog(){
  weightLog=[]; setLS("weight-log",weightLog); render();
}
function renderMiniChart(){
  if(weightLog.length<2) return '<div class="muted" style="text-align:center;padding:32px 0;">Registra almeno due pesate per vedere il grafico.</div>';
  var w=280,hh=140,pad=20;
  var weights=weightLog.map(function(l){return l.weight;});
  var min=Math.min(TARGET_WEIGHT-1, Math.min.apply(null,weights));
  var max=Math.max(START_WEIGHT+1, Math.max.apply(null,weights));
  function x(i){ return pad + i*((w-2*pad)/(weightLog.length-1)); }
  function y(val){ return hh-pad - ((val-min)/(max-min))*(hh-2*pad); }
  var pts = weightLog.map(function(l,i){ return x(i)+","+y(l.weight); }).join(" ");
  var targetY=y(TARGET_WEIGHT);
  var dots = weightLog.map(function(l,i){ return '<circle cx="'+x(i)+'" cy="'+y(l.weight)+'" r="3" fill="#E8A33D"/>'; }).join("");
  return '<svg width="100%" height="'+hh+'" viewBox="0 0 '+w+' '+hh+'" preserveAspectRatio="none">'+
    '<line x1="'+pad+'" y1="'+targetY+'" x2="'+(w-pad)+'" y2="'+targetY+'" stroke="#6FA88A" stroke-dasharray="4 3" stroke-width="1.5"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="#E8A33D" stroke-width="2.5"/>'+
    dots+
  '</svg><div class="label-sm" style="text-align:right;">— obiettivo '+TARGET_WEIGHT+' kg</div>';
}
function renderProgressi(){
  var last = weightLog.length ? weightLog[weightLog.length-1].weight : START_WEIGHT;
  var lost = (START_WEIGHT-last).toFixed(1);
  var remainingDays = Math.max(0, Math.ceil((END_DATE-state.today)/86400000));
  var remainingKg = Math.max(0, last-TARGET_WEIGHT);
  var weeklyPace = remainingDays>0 ? (remainingKg/(remainingDays/7)).toFixed(2) : "0";

  var trendTip="";
  if(weightLog.length>=3){
    var recent=weightLog.slice(-3);
    if(recent[2].weight>=recent[0].weight){
      trendTip='<div class="card" style="background:var(--amber-soft);font-size:13px;">Il peso non scende da un paio di rilevazioni: prova ad alzare la media passi di circa 1.500/die, oppure riduci leggermente i carboidrati serali nei giorni feriali.</div>';
    }
  }

  return renderTopbar()+'<div class="screen">'+
    '<div class="grid2">'+
      '<div class="card" style="background:var(--sage-soft);"><div class="label-sm">Persi finora</div><div class="title-lg serif">'+lost+' kg</div></div>'+
      '<div class="card" style="background:var(--blue-soft);"><div class="label-sm">Ritmo richiesto ora</div><div class="title-lg serif">'+weeklyPace+' kg/sett</div></div>'+
    '</div>'+
    '<div class="card"><div style="font-weight:600;margin-bottom:8px;">Andamento peso</div>'+renderMiniChart()+'</div>'+
    trendTip+
    '<div class="card">'+
      '<div style="font-weight:600;margin-bottom:8px;">Registra il peso di oggi</div>'+
      '<div class="row">'+
        '<input type="text" id="weightInput" placeholder="es. 108.5" style="flex:1;" inputmode="decimal">'+
        '<button class="pill active" style="padding:10px 14px;" onclick="saveWeight()">'+ICONS.plus+'</button>'+
      '</div>'+
      '<div id="weightErr" style="color:var(--red);font-size:12px;margin-top:6px;"></div>'+
    '</div>'+
    (weightLog.length>0 ? '<div style="text-align:center;"><span class="label-sm" style="text-decoration:underline;cursor:pointer;" onclick="resetWeightLog()">Azzera storico peso</span></div>' : '')+
  '</div>'+renderTabbar();
}

/* ---- TAB BAR ---- */
function renderTabbar(){
  var tabs=[["oggi","Oggi","flame"],["allenamento","Allenamento","foot"],["ricette","Ricette","fork"],["spesa","Spesa","cart"],["progressi","Progressi","down"]];
  return '<div class="tabbar">'+tabs.map(function(t){
    var active=state.tab===t[0];
    return '<button class="tabbtn '+(active?'active':'')+'" style="color:'+(active?'var(--amber)':'var(--text-2)')+'" onclick="goTab(\''+t[0]+'\')">'+ICONS[t[2]]+'<span>'+t[1]+'</span></button>';
  }).join("")+'</div>';
}

/* ================= RENDER ROOT ================= */
function render(){
  var app=document.getElementById("app");
  var html="";
  if(state.tab==="oggi") html=renderOggi();
  else if(state.tab==="allenamento") html=renderAllenamento();
  else if(state.tab==="ricette") html=renderRicette();
  else if(state.tab==="spesa") html=renderSpesa();
  else if(state.tab==="progressi") html=renderProgressi();
  app.innerHTML=html;
}
render();

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
